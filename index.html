<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
    <title>Today</title>

    <!-- Firebase SDK (loaded via CDN for minimal bundle size) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <script type="module" src="/src/index.js"></script>
</head>
<body>
    <div class="bg-layer" id="bgLayer"></div>

    <!-- Floating glassmorphic shapes -->
    <div class="floating-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
        <div class="shape shape-4"></div>
    </div>

    <div class="app">
        <nav class="top-bar" aria-label="App navigation">
            <div class="logo">to<span>day</span></div>
            <div class="top-bar-actions">
                <div class="sync-status" id="syncStatus" title="Sync status" aria-label="Sync status">
                    <svg class="sync-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21 12a9 9 0 0 1-9 9m9-9a9 9 0 0 0-9-9m9 9H3m9 9a9 9 0 0 1-9-9m9 9c-1.66 0-3-4.03-3-9s1.34-9 3-9m0 18c1.66 0 3-4.03 3-9s-1.34-9-3-9"></path>
                    </svg>
                    <span class="sync-text">Offline</span>
                </div>
                <button class="sound-btn" id="soundBtn" aria-label="Toggle sound effects" aria-pressed="true">
                    <svg class="sound-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                    </svg>
                    <svg class="sound-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;" aria-hidden="true">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <line x1="23" y1="9" x2="17" y2="15"></line>
                        <line x1="17" y1="9" x2="23" y2="15"></line>
                    </svg>
                </button>
                <button class="theme-btn" id="themeBtn" aria-label="Choose theme">
                    <span class="dot"></span>
                    <span>Theme</span>
                </button>
            </div>
        </nav>

        <main class="main-content">
            <header class="header">
                <div class="time-display" id="timeDisplay" aria-label="Current time">12:00</div>
                <div class="date-display" id="dateDisplay">Wednesday, December 3</div>
                <h1 class="greeting">Good <span id="timeOfDay">morning</span>, <span id="userName">Aiden</span></h1>
            </header>

            <section class="progress-section" aria-label="Task progress">
                <div class="progress-ring-container">
                    <svg class="progress-ring" width="110" height="110" aria-hidden="true">
                        <circle class="progress-ring-bg" cx="55" cy="55" r="45"/>
                        <circle class="progress-ring-fill" id="progressRing" cx="55" cy="55" r="45"/>
                    </svg>
                    <div class="progress-center">
                        <span class="progress-number" id="progressPercent">0%</span>
                        <span class="progress-label">Complete</span>
                    </div>
                </div>
                <div class="progress-stats">
                    <div class="stat-item">
                        <div class="stat-dot remaining"></div>
                        <span class="stat-text"><strong id="remainingCount">0</strong> remaining</span>
                    </div>
                    <div class="stat-item">
                        <div class="stat-dot completed"></div>
                        <span class="stat-text"><strong id="completedCount">0</strong> completed</span>
                    </div>
                </div>
            </section>

            <div class="task-input-wrapper">
                <div class="task-input-container">
                    <input type="text" class="task-input" id="taskInput"
                           placeholder="What do you need to do today?"
                           autocomplete="off" aria-label="New task text" maxlength="500">
                    <button class="add-btn" id="addBtn" aria-label="Add task">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        Add Task
                    </button>
                </div>
                <p class="shortcut-hint">Press <kbd>Enter</kbd> to add quickly</p>
            </div>

            <section class="task-list-container" aria-label="Tasks">
                <div class="task-list-header">
                    <span class="task-list-title">Today's Tasks</span>
                    <button class="clear-completed-btn" id="clearCompletedBtn" aria-label="Clear completed tasks">Clear completed</button>
                </div>
                <ul class="task-list" id="taskList" role="list" aria-label="Task list">
                    <!-- Tasks render here -->
                </ul>
            </section>

            <section class="quote-section" aria-label="Motivational quote">
                <p class="quote-text" id="quoteText">"The secret of getting ahead is getting started."</p>
            </section>
        </main>
    </div>

    <!-- Theme Modal -->
    <div class="theme-modal-overlay" id="themeOverlay"></div>
    <div class="theme-modal" id="themeModal" role="dialog" aria-label="Theme picker">
        <div class="theme-modal-header">
            <h2 class="theme-modal-title">Choose Your Vibe</h2>
            <button class="theme-modal-close" id="themeClose" aria-label="Close theme picker">&times;</button>
        </div>
        <div class="theme-grid" id="themeGrid" role="group" aria-label="Available themes"></div>
    </div>

    <!-- Screen reader announcements -->
    <div class="sr-only" aria-live="polite" id="statusAnnouncer"></div>
</body>
</html>
